<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Clip Recorder</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header class="app-header">
    <div class="logo" aria-hidden="true">🤟</div>
    <div>
      <h1>Sign Clip Recorder</h1>
      <p class="subtitle">Record sign language clips for the dataset</p>
    </div>
    <button id="helpBtn" class="help-btn" type="button">📖 Instructions</button>
  </header>
  <div id="error" class="error" hidden></div>

  <div class="stage">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
    <div id="countdown" class="countdown"></div>
    <div id="badge" class="badge"><i></i>Recording</div>
  </div>

  <div class="sign-card">
    <div>
      <div class="sign-label">Now signing</div>
      <div id="signWord" class="sign-word">—</div>
    </div>
    <span id="handBadge" class="hand-badge" data-side="LEFT">LEFT HAND</span>
  </div>

  <div class="controls">
    <div class="field">
      <label for="label">Word / letter and hand</label>
      <select id="label" aria-label="Word or letter and which hand to sign with"></select>
    </div>
    <button id="folderBtn" type="button">📁 Choose save folder</button>
  </div>
  <p id="folderName" class="folder">No folder chosen.</p>
  <p id="nextFile" class="folder"></p>

  <button id="recordBtn" type="button" disabled>● Record</button>
  <p id="status" role="status" aria-live="polite">Starting…</p>
  <p class="hint"><kbd>Space</kbd> starts a recording. <kbd>Esc</kbd> cancels the countdown or the current clip (nothing is saved).</p>

  <h2>Saved this session: <span id="count">0</span></h2>
  <ul id="clips"><li class="empty">No clips yet.</li></ul>
</main>

<!-- First-time instructions (cannot be skipped or closed until the last step) -->
<div id="intro" class="intro" role="dialog" aria-modal="true" aria-labelledby="introTitle" hidden>
  <div class="intro-card">
    <p class="intro-kicker">Welcome! Step <span id="introNum">1</span> of <span id="introTotal">5</span></p>
    <div id="introIcon" class="intro-icon" aria-hidden="true"></div>
    <h3 id="introTitle" class="intro-title"></h3>
    <p id="introText" class="intro-text"></p>
    <pre id="introTree" class="intro-tree" hidden></pre>
    <div id="introDots" class="intro-dots" aria-hidden="true"></div>
    <div class="intro-actions">
      <button id="introBack" type="button">Back</button>
      <button id="introNext" type="button" class="intro-next">Next</button>
    </div>
  </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
